name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  release:
    # Only run if PR was merged and has a release label
    if: |
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release:major') ||
       contains(github.event.pull_request.labels.*.name, 'release:minor') ||
       contains(github.event.pull_request.labels.*.name, 'release:patch'))

    runs-on: ubuntu-latest
    environment: pypi
    env:
      PYTHON_VERSION: "3.13"

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for proper versioning
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: 📦 Install dependencies
        run: |
          uv pip install --system build hatch bump2version

      - name: 🏷️ Determine version bump type
        id: bump_type
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}" == "true" ]]; then
            echo "TYPE=major" >> $GITHUB_OUTPUT
            echo "Detected major version bump from PR labels"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}" == "true" ]]; then
            echo "TYPE=minor" >> $GITHUB_OUTPUT
            echo "Detected minor version bump from PR labels"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:patch') }}" == "true" ]]; then
            echo "TYPE=patch" >> $GITHUB_OUTPUT
            echo "Detected patch version bump from PR labels"
          fi

      - name: 🏷️ Get current version and calculate new version
        id: version
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Strip 'v' prefix if present
          CURRENT_VERSION=${LATEST_TAG#v}
          echo "Current version: $CURRENT_VERSION"

          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Calculate new version based on bump type
          case "${{ steps.bump_type.outputs.TYPE }}" in
            major)
              NEW_MAJOR=$((MAJOR + 1))
              NEW_VERSION="${NEW_MAJOR}.0.0"
              ;;
            minor)
              NEW_MINOR=$((MINOR + 1))
              NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
              ;;
            patch)
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
              ;;
          esac

          echo "New version: $NEW_VERSION"
          echo "VERSION=v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_NUMBER=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: 📦 Build distribution
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          TAG="${{ steps.version.outputs.VERSION }}"
          VERSION_NUMBER="${{ steps.version.outputs.VERSION_NUMBER }}"

          # Local tag so hatch-vcs versions the build. Push only after
          # the wheel version is confirmed (a failed publish can retry).
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAGGED=$(git rev-list -n 1 "$TAG")
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$TAGGED" != "$HEAD_SHA" ]; then
              echo "Tag $TAG already points at $TAGGED, not $HEAD_SHA"
              exit 1
            fi
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi

          python -m build --wheel --sdist

          VERSION_LINE=$(tar -xOf dist/*.tar.gz --wildcards '*/PKG-INFO' | grep -E '^Version:' | head -1)
          echo "Built $VERSION_LINE"
          echo "$VERSION_LINE" | grep -E "^Version: ${VERSION_NUMBER}$"

      - name: 🏷️ Push tag
        run: |
          git push origin "${{ steps.version.outputs.VERSION }}"

      - name: 📋 Generate release notes from PR
        id: release_notes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Determine release type based on branch
          if [[ "$PR_BRANCH" =~ ^hotfix-.* ]]; then
            RELEASE_TYPE="🔥 Hotfix"
          else
            RELEASE_TYPE="🚀 Release"
          fi

          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMIT_NOTES="Initial release"
          else
            COMMIT_NOTES=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD)
          fi

          # Combine PR info and commit notes
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "### $RELEASE_TYPE" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**$PR_TITLE** (#$PR_NUMBER) by @$PR_AUTHOR" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### 📝 Commits" >> $GITHUB_OUTPUT
          echo "$COMMIT_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## 🎉 Release ${{ steps.version.outputs.VERSION }}

            ${{ steps.release_notes.outputs.NOTES }}

            ### 📦 Installation
            ```bash
            pip install strapi-kit==${{ steps.version.outputs.VERSION_NUMBER }}
            ```

            ### 🔗 Links
            - [PyPI Package](https://pypi.org/project/strapi-kit/${{ steps.version.outputs.VERSION_NUMBER }}/)
            - [Documentation](https://mehdizare.github.io/strapi-kit/)
          files: dist/*
          prerelease: false
          generate_release_notes: true

      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false
